name: Build and publish mermaid-confluence-publisher image

on:
  push:
    branches: ["main", "master"]
    tags: ["*"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: heyarny/mermaid-confluence-publisher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image version (current UTC datetime)
        run: echo "IMAGE_VERSION=$(date -u +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
